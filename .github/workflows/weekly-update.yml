name: Weekly fundamentals refresh

# Free for public repos (unlimited Actions minutes). Fundamentals change
# quarterly at most, so a weekly cron is already more than enough --
# running daily would just be wasted compute for data that hasn't changed.
on:
  schedule:
    - cron: "0 6 * * 1"   # 06:00 UTC every Monday
  workflow_dispatch: {}

# Prevents a manual run from racing the cron (or a double-click on "Run
# workflow"): without this, two overlapping runs can both reach `git push`,
# the second gets rejected as non-fast-forward, and that run's Pages deploy
# never happens -- silent stale-site failure with no obvious cause in the
# Actions log. Queue rather than cancel, since a bot commit mid-flight
# shouldn't be killed.
concurrency:
  group: weekly-update
  cancel-in-progress: false

permissions:
  contents: write          # needed so the bot can commit the refreshed JSON
  pages: write              # needed to deploy the refreshed site
  id-token: write           # needed for the Pages deployment

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Belt-and-suspenders alongside the concurrency group above: sync to
      # the latest main now, while the tree is still clean.
      - name: Sync with latest main
        run: git pull --rebase origin main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline (live)
        # A single ticker failing (rate limit hiccup, a CIK that moved) fails
        # this step but the pipeline itself already wrote every OTHER
        # ticker's output by then -- continue-on-error keeps the commit/
        # deploy steps running so the rest of the site still ships, and the
        # flagged step in the Actions log is what surfaces the failure.
        continue-on-error: true
        env:
          TENLINE_LIVE: "1"
        run: |
          cd pipeline
          python run_all.py

      - name: Commit refreshed data
        run: |
          git config user.name "tenline-bot"
          git config user.email "actions@github.com"
          git add site/data
          # [skip ci] suppresses every push/pull_request-triggered workflow
          # repo-wide, not just this one -- harmless here since a
          # GITHUB_TOKEN-authored push doesn't trigger other workflows'
          # on:push anyway (see pages.yml's comment).
          git diff --staged --quiet || git commit -m "chore: weekly fundamentals refresh [skip ci]"
          git push

      # A GITHUB_TOKEN-authored push above does not itself trigger pages.yml's
      # `on: push` (GitHub suppresses workflow-triggered chaining), so deploy
      # the refreshed site directly here too.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
